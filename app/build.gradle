plugins { id 'com.android.application' }
android {
    namespace 'com.hongseop.ordiloom.community'
    compileSdk 36
    defaultConfig {
        applicationId 'com.hongseop.ordiloom.community'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
